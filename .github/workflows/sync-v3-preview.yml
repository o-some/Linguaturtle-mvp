name: Build and test V3 preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v3-preview.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch V3 development branch
        run: |
          git fetch origin feature/v3-foundation:refs/remotes/origin/feature/v3-foundation
          rm -rf /tmp/v3-source
          git worktree add /tmp/v3-source origin/feature/v3-foundation

      - name: Assemble same-origin preview
        run: |
          rm -rf v3-preview/src v3-preview/assets
          mkdir -p v3-preview/src/v3 v3-preview/assets/illustrations
          cp -R /tmp/v3-source/src/v3/. v3-preview/src/v3/
          cp -R /tmp/v3-source/assets/illustrations/. v3-preview/assets/illustrations/
          cat > v3-preview/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
            <meta name="theme-color" content="#073f67" />
            <meta name="description" content="LinguaTurtle 3.0 – vollständige Testversion." />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="default" />
            <link rel="stylesheet" href="./src/v3/styles.css" />
            <link rel="stylesheet" href="./src/v3/features.css" />
            <link rel="stylesheet" href="./src/v3/advanced-games.css" />
            <link rel="stylesheet" href="./src/v3/gamification.css" />
            <link rel="stylesheet" href="./src/v3/island-expansion.css" />
            <link rel="stylesheet" href="./src/v3/tula-home.css" />
            <link rel="stylesheet" href="./src/v3/adaptive-learning.css" />
            <link rel="stylesheet" href="./src/v3/speaking-stories.css" />
            <link rel="stylesheet" href="./src/v3/child-profiles.css" />
            <title>LinguaTurtle 3.0 – Full Preview</title>
          </head>
          <body>
            <main id="app" aria-live="polite">
              <div style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#eaf8ff,#fffdf8);font:700 18px system-ui;color:#073f67"><div style="text-align:center"><div style="font-size:76px">🐢</div><p>Turtle Island wird geladen …</p></div></div>
            </main>
            <div style="position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:998;border:1px solid rgba(207,225,234,.9);border-radius:999px;background:rgba(255,255,255,.88);padding:7px 10px;font:800 10px system-ui;color:#073f67;backdrop-filter:blur(12px)">V3 TEST · FULL BUILD</div>
            <script type="module" src="./src/v3/boot.js"></script>
          </body>
          </html>
          HTML

      - name: JavaScript syntax checks
        run: |
          for file in v3-preview/src/v3/*.js; do
            node --check "$file"
          done

      - name: Verify required files
        run: |
          test -f v3-preview/src/v3/app.js
          test -f v3-preview/src/v3/boot.js
          test -f v3-preview/src/v3/advanced-games.js
          test -f v3-preview/src/v3/gamification.js
          test -f v3-preview/src/v3/island-expansion.js
          test -f v3-preview/src/v3/tula-home.js
          test -f v3-preview/src/v3/adaptive-learning.js
          test -f v3-preview/src/v3/speaking-stories.js
          test -f v3-preview/src/v3/child-profiles.js
          test -f v3-preview/assets/illustrations/tula-welcome.svg
          test -f v3-preview/assets/illustrations/turtle-island.svg

      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install chromium

      - name: Browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/linguaturtle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat > /tmp/smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors=[];
          page.on('pageerror', e=>errors.push(String(e)));
          page.on('console', m=>{ if(m.type()==='error') errors.push(m.text()); });
          await page.goto('http://127.0.0.1:4173/v3-preview/', {waitUntil:'networkidle', timeout:30000});
          await page.waitForTimeout(1500);
          const body=(await page.locator('body').innerText()).trim();
          if(!body || body.includes('Turtle Island wird geladen')) throw new Error('V3 remained on loader');
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          const app=page.locator('#app');
          if(await app.count()!==1) throw new Error('App container missing');
          const buttons=page.locator('button');
          if(await buttons.count()<2) throw new Error('Interactive controls missing');
          const language=page.locator('[data-action="language"], button').filter({hasText:/DE|ES/}).first();
          if(await language.count()) await language.click();
          const garden=page.getByText(/Garten|Jardín/).first();
          if(await garden.count()) await garden.click();
          await page.waitForTimeout(400);
          if((await page.locator('button').count())<2) throw new Error('Navigation to learning world failed');
          await browser.close();
          console.log('V3 browser smoke test passed');
          JS
          node /tmp/smoke.mjs

      - name: Commit tested preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-preview
          if git diff --cached --quiet; then
            echo "Preview already up to date"
          else
            git commit -m "build: publish tested full V3 preview [skip ci]"
            git push origin main
          fi
